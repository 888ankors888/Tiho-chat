<style>
:root{--bg:#f1f6f2;--card:#ffffff;--tx:#17231b;--mut:#5f7266;--me:#1a7f45;--other:#e0ebe3;--bd:#cbdcd0;--ok:#25a35a;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1913;--card:#18261d;--tx:#e6f1ea;--mut:#8fa699;--me:#1f8a4c;--other:#223329;--bd:#2f4437;--ok:#4cc27f;--bad:#e8715f}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* the app is pinned to the visible screen: header on top, composer at the bottom, only the messages scroll */
.w{position:fixed;top:0;left:0;right:0;max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.s{display:none;padding:20px 16px;gap:10px;flex-direction:column;overflow-y:auto}.s.on{display:flex}
#sl.on,#chat.on{padding:0;flex:1;min-height:0;overflow:hidden}
h1{margin:0;font-size:19px}.tt{flex:1;min-width:0;font-size:18px}p{margin:0;color:var(--mut);font-size:12px}
button{font:inherit;border:0;border-radius:12px;background:var(--me);color:#fff;padding:10px 16px;cursor:pointer}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:6px 12px;font-size:12px}
button:disabled{opacity:.5}
input{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;width:100%;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd)}
#hs{flex:1;min-width:0}
#ttl{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}
.sub b.on{background:var(--ok)}
#mem{padding:8px 16px;border-bottom:1px solid var(--bd);font-size:11px;color:var(--mut);max-height:96px;overflow-y:auto}
#mem .mh{font-weight:600;cursor:pointer;user-select:none;margin-bottom:4px}
#mem.c .mh{margin-bottom:0}#mem.c .mc{display:none}
#mem .mc{display:inline-flex;align-items:center;margin:0 12px 3px 0;white-space:nowrap}
#mem .mc::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--bd);margin-right:5px}
#mem .mc.on{color:var(--tx)}#mem .mc.on::before{background:var(--ok)}
.on-n{display:inline-flex;align-items:center;gap:4px}
.on-n::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bd)}
.on-n.on::before{background:var(--ok)}.on-n:empty::before{display:none}
#cl{flex:1;min-height:0;overflow-y:auto}
.empty{margin:40px auto 0;padding:0 16px;text-align:center;color:var(--mut);font-size:12px;max-width:36ch}
.ci{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.ci:hover{background:var(--other)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--me);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cb{flex:1;min-width:0}
.ct{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--mut)}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--me);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.del{flex:none;padding:4px 8px !important}
.addbar{padding:10px 12px;border-top:1px solid var(--bd)}
#jf{display:grid;grid-template-columns:1fr 1fr;gap:8px}#jf button{grid-column:1/-1}
#je{color:var(--bad);font-size:11px;padding:6px 4px 0}
.seg{grid-column:1/-1;display:flex;gap:8px}.seg button{flex:1}
button.g.sel{background:var(--me);color:#fff;border-color:var(--me)}
#m{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
#m>:first-child{margin-top:auto}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--other);overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}.b.ot{align-self:flex-start;border-bottom-left-radius:4px}
.b .who{display:block;font-size:11px;font-weight:600;opacity:.75}
.b small{display:block;font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.sys{align-self:center;color:var(--mut);font-size:11px;text-align:center}
#f{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
#f input{width:100%}#f button{flex:none;min-width:180px}
.ir{display:flex;gap:8px;width:100%}#f .ir input{flex:1;width:auto}#f .ir button{min-width:0;padding:10px 14px}
.b progress{display:block;width:100%;height:6px;margin:6px 0;accent-color:var(--ok)}.b.me progress{accent-color:#fff}
.b img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin:6px 0}
.b a{color:inherit;font-weight:600}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}

[hidden]{display:none!important}
.hero{text-align:center;padding:8px 0 4px}.hero img{width:72px;height:72px;border-radius:22px;box-shadow:0 6px 20px rgba(26,127,69,.28)}
.hero h1{margin:10px 0 4px;font-size:23px}.hero p{max-width:34ch;margin:0 auto}
.dv{display:grid;gap:10px}
.d{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;width:100%}
.d:hover,.d.sel{border-color:var(--me)}.d.sel{box-shadow:0 0 0 2px var(--me) inset}
.d .ic{flex:none;width:40px;text-align:center;font-size:25px}
.d b{display:block;font-size:15px}.d small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.d .rec{margin-left:auto;flex:none;font-size:11px;background:var(--me);color:#fff;border-radius:10px;padding:2px 8px}
#dp{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}
#dp>b{font-size:15px}#dp ol{margin:0;padding-left:20px;font-size:13px}#dp li{margin:7px 0}
#dp .hint{color:var(--mut);font-size:12px}
code.cmd{display:block;background:var(--other);border-radius:10px;padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;user-select:all}
#dweb{margin-top:6px;height:48px;font-size:15px}
#dmore{margin-top:6px}
.ft{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;text-align:left;font-size:12px;line-height:1.4;color:var(--mut)}
.ft li{display:flex;gap:10px;align-items:flex-start}.ft .i{flex:none;width:24px;text-align:center;font-size:16px}
@supports (-webkit-touch-callout:none){input,textarea{font-size:16px}}
#sl .top{flex-wrap:wrap}
#shs{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#shb{width:100%;max-width:640px;max-height:85%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#shb h3{margin:0 0 4px;font-size:15px}#shb p{margin:0 0 8px;font-size:12px;color:var(--mut)}
.shg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.shg a,.shg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);text-decoration:none;font-size:12px;cursor:pointer}
.shg .i{font-size:22px}
.cr{display:block;width:100%;text-align:left;margin:4px 0 0;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;cursor:pointer}
.crl{font-size:11px;color:var(--mut);margin-top:10px}
#pmw{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60}
#pm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 52px);right:12px;width:min(280px,calc(100% - 24px));background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#pm button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;color:var(--tx);padding:12px 14px;font-size:14px;font-weight:400}
#pm button:last-child{border-bottom:0}#pm .i{width:22px;text-align:center;font-size:17px}
#shb .op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin:0 0 8px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-weight:400}
#shb .op.rec{border:2px solid var(--me)}#shb .op .i{font-size:22px;flex:none;width:28px;text-align:center}
#shb .op b{display:block;font-size:14px;font-weight:600}#shb .op .s{font-size:12px;color:var(--mut)}
#shb input{width:100%;margin:0 0 8px}#je2{color:var(--bad);font-size:12px;min-height:16px;margin:0 0 8px}

/* ===== ГГ чат: экран «Чаты» — Modern Minimalist / iOS ===== */
:root{--room:#e8f2ec;--prev:#33433a;--acc:#2f8f5b;--sq:rgba(47,143,91,.13);--ic:#4a6556;--glow:rgba(26,127,69,.35);--lk:#3a423d}
@media (prefers-color-scheme:dark){:root{--room:#1d2f25;--prev:#b7cbbf;--acc:#5ccf8f;--sq:rgba(255,255,255,.08);--ic:#9fb8aa;--glow:rgba(0,0,0,.5);--lk:#c3d6ca}}
#sl.on{position:relative;background:linear-gradient(180deg,#fafcfb 0%,#eef5f0 45%,#d8eadf 100%)}
@media (prefers-color-scheme:dark){#sl.on{background:linear-gradient(180deg,#0f1913 0%,#122219 55%,#143023 100%)}}

/* шапка */
.nh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.nt{margin:0;font-size:28px;font-weight:600;letter-spacing:-.3px;color:var(--acc)}
.ng{background:transparent;color:var(--ic);width:40px;height:40px;padding:0;margin-right:-6px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ng svg{width:26px;height:26px}
.ng:active{background:var(--sq)}

/* поиск */
.nq{position:relative;margin:8px 16px 0}
.nq svg{position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--ic);opacity:.85;pointer-events:none}
.nq input{height:44px;border:0;border-radius:14px;background:var(--sq);padding:0 14px 0 44px;color:var(--tx);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nq input::placeholder{color:var(--mut);opacity:.9}
.nls{padding:10px 20px 6px;min-height:30px;text-align:center}

/* карточки комнат */
#cl{padding:4px 16px 120px}
#cl .ci{background:var(--room);border:0;border-radius:20px;padding:14px 16px;margin:0 0 10px;gap:14px;position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .12s ease}
#cl .ci:hover{background:var(--room);filter:brightness(.985)}
#cl .ci:active{transform:scale(.985)}
#cl .empty{margin-top:32px}

/* аватар + индикатор онлайн */
.av{position:relative;width:52px;height:52px;font-size:22px;font-weight:600;overflow:visible}
.av.gen{background:none}
.av.gen svg{display:block;width:100%;height:100%;border-radius:50%}
.av::after{content:"";display:none;position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid var(--room)}
.ci.live .av::after{display:block}

/* название + иконки закрепа / замка */
#cl .ct{display:flex;align-items:center;gap:6px;font-size:16.5px;font-weight:600}
.ct .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct svg{flex:none}
.ipin{width:18px;height:18px;color:var(--ic);transform:rotate(35deg)}
.ilk{width:15px;height:15px;color:var(--lk)}
#cl .cp{font-size:14px;color:var(--prev);margin-top:3px}

/* справа: время, онлайн, бейдж */
#cl .cm{align-items:flex-end;gap:7px;font-size:13px;color:var(--prev)}
.nrow{display:flex;align-items:center;gap:8px}
.on-n{font-size:13px;color:var(--prev)}
.on-n.on::before{background:#6fcf97}
.bdg{min-width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:600}

/* выйти из комнаты: долгое нажатие на телефоне, ✕ при наведении на ПК */
#cl .del{display:none;position:absolute;top:-6px;right:-4px;width:24px;height:24px;padding:0!important;border-radius:50%;align-items:center;justify-content:center;background:var(--card);color:var(--mut);border:1px solid var(--bd);font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (hover:hover){#cl .ci:hover .del{display:flex}}

/* плавающая кнопка */
.nfab{position:absolute;left:0;right:0;bottom:20px;padding:0 16px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.nfab>*{pointer-events:auto}
#nr{width:auto;display:flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;font-size:16px;font-weight:500;background:linear-gradient(180deg,#2f9a62,#1f7f4c);box-shadow:0 10px 24px var(--glow),0 2px 6px rgba(0,0,0,.12)}
#nr:active{transform:scale(.97)}
#nr svg{width:20px;height:20px}
#je:empty{display:none}
#je{background:var(--card);border-radius:10px;padding:6px 10px!important;text-align:center}
#pm{top:calc(env(safe-area-inset-top,0px) + 64px)}

/* ===== ГГ чат: шторка «Новая комната» — Modern Minimalist / iOS ===== */
:root{--sheet:rgba(255,255,255,.9);--cl:rgba(255,255,255,.75);--em:#2fa36b;--emg:rgba(47,163,107,.22)}
@media (prefers-color-scheme:dark){:root{--sheet:rgba(24,38,29,.92);--cl:rgba(255,255,255,.07);--em:#4cc27f;--emg:rgba(76,194,127,.25)}}
#shs{background:rgba(20,45,32,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#shb{background:var(--sheet);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-radius:28px 28px 0 0;padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(20,60,40,.18)}
#shb h3{margin:0 6px 16px;font-size:26px;font-weight:500;letter-spacing:-.2px;text-align:left;color:var(--tx)}

/* варианты действий */
#shb .op{gap:14px;margin:0 0 10px;padding:14px 16px;min-height:64px;border:2px solid transparent;border-radius:16px;background:var(--room);color:var(--tx);transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease}
#shb .op .i{width:44px;font-size:30px;line-height:1}
#shb .op b{font-size:18px;font-weight:500;line-height:1.25}
#shb .op:active{transform:scale(.985)}
#shb .op.rec,#shb .op.sel{border-color:var(--em);box-shadow:0 0 0 4px var(--emg),0 6px 18px var(--emg)}

/* «Закрыть» / «Назад» */
#shb>button.g{display:block;width:100%;margin-top:14px!important;padding:16px;border:0;border-radius:16px;background:var(--cl);box-shadow:inset 0 0 0 1px rgba(47,143,91,.14);color:var(--tx);font-size:17px;font-weight:400}
#shb>button.g:active{transform:scale(.985)}

/* ===== ГГ чат: выпадающее меню (шестерёнка) — Modern Minimalist / iOS ===== */
:root{--mt:#3f4943}
@media (prefers-color-scheme:dark){:root{--mt:#e1ece5}}
#pm{right:16px;width:min(300px,calc(100% - 32px));padding:6px 0;background:var(--sheet);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(47,143,91,.2);border-radius:24px;box-shadow:0 12px 36px rgba(20,60,40,.2),0 2px 8px rgba(20,60,40,.08);transform-origin:top right;animation:pmIn .18s ease-out}
@keyframes pmIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#pm button{position:relative;gap:14px;padding:14px 18px;border:0;font-size:17px;font-weight:400;line-height:1.25;color:var(--mt)}
#pm button+button::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:rgba(60,90,70,.14)}
#pm button:active{background:rgba(47,143,91,.1)}
#pm .i{width:30px;font-size:26px;line-height:1}

/* ===== роли ===== */
.b[data-mid]{cursor:pointer}
#mem .mc.act{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#f input:disabled{opacity:.6}
</style>
</head>

/* ---------- roles: owner / admin / member / read-only ----------
   No server exists, so roles are enforced by honest clients and protected by signatures:

var ROLE={owner:{ic:"👑",nm:"Владелец"},admin:{ic:"🛡️",nm:"Админ"},member:{ic:"",nm:"Участник"},readonly:{ic:"👁️",nm:"Наблюдатель"}};

var myFp="",myPk="",mySk=null,RC={},inflight={},GQ={},vkc={};

  try{
    var alg={name:"ECDSA",namedCurve:"P-256"},jw=lsGet("pc-sk"),pk=lsGet("pc-pk"),prv=null;
    if(jw&&pk){try{prv=await crypto.subtle.importKey("jwk",JSON.parse(jw),alg,false,["sign"])}catch(e){prv=null}}
    if(!prv){
      var kp=await crypto.subtle.generateKey(alg,true,["sign","verify"]);
      var jwk=await crypto.subtle.exportKey("jwk",kp.privateKey);
      pk=toB64(new Uint8Array(await crypto.subtle.exportKey("raw",kp.publicKey)));
      lsSet("pc-sk",JSON.stringify(jwk));lsSet("pc-pk",pk);
      prv=await crypto.subtle.importKey("jwk",jwk,alg,false,["sign"])}

async function signStr(str){return toB64(new Uint8Array(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},mySk,new TextEncoder().encode(str))))}
async function verStr(pk,sg,str){

/* returns the sender's fingerprint when the message signature is valid, "" otherwise */
async function verifyMsg(o){

  var sg=o.sg;delete o.sg;
  if(!(await verStr(o.pk,sg,JSON.stringify(o))))return "";
  return await fpOf(o.pk)}

/* who may change whose role: owner -> anyone (admin / member / read-only, or hand over ownership);

function permit(ar,tr,nr){
  if(nr==="owner")return ar==="owner"&&tr!=="owner";
  if(tr==="owner")return false;
  if(ar==="owner")return nr==="admin"||nr==="member"||nr==="readonly";
  if(ar==="admin")return (nr==="member"||nr==="readonly")&&(tr==="member"||tr==="readonly");
  return false}
function grantStr(room,g){return ["g",room,g.a,g.p,g.r,g.ts].join("|")}
/* rebuild the current roles from signed grants, oldest first; a grant that its signer was not allowed to make is ignored */
function replay(list){
  var gs=list.slice().sort(function(a,b){return a.ts-b.ts||(a.s<b.s?-1:a.s>b.s?1:0)});
  var owner="",roles={},ap={};
  gs.forEach(function(g){
    var ar=g.a===owner?"owner":(roles[g.a]||"member");
    if(g.r==="owner"){
      if(!owner){if(g.a===g.p){owner=g.p;ap[g.s]=1}}
      else if(g.a===owner&&g.p!==owner){roles[owner]="admin";owner=g.p;delete roles[g.p];ap[g.s]=1}
      return}
    if(!owner||g.a===g.p)return;
    var tr=g.p===owner?"owner":(roles[g.p]||"member");
    if(!permit(ar,tr,g.r))return;
    if(g.r==="member")delete roles[g.p];else roles[g.p]=g.r;
    ap[g.s]=1});

function getRoles(room){
  if(RC[room])return RC[room];
  var ch=chatById(room);return (RC[room]=replay((ch&&ch.gr)||[]))}
function hasRoles(room){return !!getRoles(room).owner}
/* "" = the room has no owner yet, so roles are off */
function roleOf(room,fp){

  return fp===c.owner?"owner":(c.roles[fp]||"member")}
function myRole(room){return myFp?roleOf(room,myFp):""}
function nameOfFp(ch,fp){

  return "Участник"}
function pruneGrants(ch){
  var gr=ch.gr||[],act={},last={};
  gr.forEach(function(g){act[g.a]=1;if(g.r!=="owner"){var l=last[g.p];if(!l||g.ts>l.ts||(g.ts===l.ts&&g.s>l.s))last[g.p]=g}});
  gr=gr.filter(function(g){return g.r==="owner"||last[g.p]===g||act[g.p]});

  if(keep.length>250){
    var drop={};keep.sort(function(a,b){return a.ts-b.ts}).slice(0,keep.length-250).forEach(function(g){drop[g.s]=1});

function addGrants(room,list){
  var p=(GQ[room]||Promise.resolve()).then(function(){return addGrantsRun(room,list)}).catch(function(){return false});
  GQ[room]=p;return p}
async function addGrantsRun(room,list){
  var ch=chatById(room);if(!ch||!Array.isArray(list))return false;

  for(var i=0;i<list.length&&i<300;i++){
    var g=list[i];
    if(!g||typeof g.a!=="string"||typeof g.p!=="string"||typeof g.ak!=="string"||typeof g.s!=="string"||typeof g.ts!=="number"||typeof g.r!=="string")continue;
    if(ROLE_IDS.indexOf(g.r)<0||g.a.length>30||g.p.length>30||g.ak.length>120||g.s.length>140)continue;
    if(have[g.s]||g.ts>Date.now()+600000)continue;
    if(g.r==="owner"&&g.a===g.p&&before.owner)continue;   /* first claim wins */
    if((await fpOf(g.ak))!==g.a)continue;
    if(!(await verStr(g.ak,g.s,grantStr(room,g))))continue;
    have[g.s]=1;cand.push({a:g.a,ak:g.ak,p:g.p,r:g.r,ts:g.ts,s:g.s})}

function announceRoles(room,b,a){
  var ch=chatById(room);if(!ch)return;
  if(room===cur){
    var fs={};[b.owner,a.owner].concat(Object.keys(b.roles),Object.keys(a.roles)).forEach(function(f){if(f)fs[f]=1});
    Object.keys(fs).forEach(function(f){
      var r1=a.owner===f?"owner":(a.roles[f]||"member"),r0=b.owner?(b.owner===f?"owner":(b.roles[f]||"member")):"";
      if(!b.owner&&r1!=="owner")return;
      if(r0===r1)return;

  applyRoleUI();refreshWho();if(cur)renderMembers()}
function sendState(room){var ch=chatById(room);if(ch&&ch.gr&&ch.gr.length)send(room,{k:"gr",gs:ch.gr})}
function nextTs(ch){var t=Date.now();(ch.gr||[]).forEach(function(g){if(g.ts>=t)t=g.ts+1});return t}

/* message deletion: author deletes own, owner deletes any, admin deletes members' */
function delOk(room,delFp,authFp){

  var dr=roleOf(room,delFp);
  if(dr==="owner")return true;
  if(dr==="admin"){var tr=authFp?roleOf(room,authFp):"member";return tr==="member"||tr==="readonly"}

function tomb(ch,id,fp){var d=ch.dl||(ch.dl={});d[id]=fp;var ks=Object.keys(d);if(ks.length>300)delete d[ks[0]];saveChats()}

async function send(room,o){
  if(!keys[room])return;
  o.id=rnd(10);o.c=me;o.u=uid;seen[o.id]=1;
  if(mySk){o.pk=myPk;o.sg=await signStr(JSON.stringify(o))}
  /* text messages go with QoS 1 so the server keeps them for offline members; presence and files are live only */
  var p=await enc(keys[room],o),opt=(o.k==="m"||o.k==="gr"||o.k==="del")?{qos:1,properties:{messageExpiryInterval:604800}}:{qos:0};
  clients.forEach(function(c){if(c.connected)c.publish(TP+room,p,opt)})}
async function handle(topic,buf){
  var room=topic.slice(TP.length),ch=chatById(room);
  if(!ch||!keys[room])return;
  var o;
  try{o=await dec(keys[room],buf.toString())}
  catch(e){
    badCnt[room]=(badCnt[room]||0)+1;
    if(room===cur){upd();if(badCnt[room]===2&&!okRoom[room])sys("Не получается расшифровать сообщения участников. Скорее всего, пароль неверный. Выйдите из комнаты (✕ в списке) и войдите снова.")}
    return}

  if(!o||!o.id||seen[o.id]||inflight[o.id]||typeof o.c!=="string"||o.c===me)return;
  inflight[o.id]=1;
  var fp="";try{fp=await verifyMsg(o)}catch(e){fp=""}
  delete inflight[o.id];
  if(seen[o.id])return;
  /* a room with an owner accepts only signed messages; read-only users cannot post */
  if(hasRoles(room)){
    if(!fp)return;
    if((o.k==="m"||o.k==="fm"||o.k==="fc")&&roleOf(room,fp)==="readonly")return}
  seen[o.id]=1;
  var who=String(o.n||o.nm||"Участник").slice(0,30);
  var now=Date.now();
  var key=memKey(o.u,who);
  if(!(typeof o.ts==="number"&&now-o.ts>60000))(peers[room]=peers[room]||{})[o.c]={n:who,t:now,k:key,f:fp};  /* old backlog does not mean "online" */

var WIN_TPL="@echo off\r\nchcp 65001 >nul\r\npowershell -NoProfile -ExecutionPolicy Bypass -Command \"$t=[IO.File]::ReadAllText('%~f0',[Text.Encoding]::UTF8); iex $t.Substring($t.IndexOf('#PS'+'-START')+10)\"\r\nexit /b\r\n#PS-START\r\n$ErrorActionPreference = 'Stop'\r\n$url  = '%%URL%%'\r\n$name = 'Чат'\r\n$dst  = Join-Path $env:LOCALAPPDATA 'ChatApp'\r\nNew-Item -ItemType Directory -Force -Path $dst | Out-Null\r\n$ico = Join-Path $dst 'chat.ico'\r\n[IO.File]::WriteAllBytes($ico, [Convert]::FromBase64String('%%ICO%%'))\r\n\r\n$cands = @(\r\n  \"${env:ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe\",\r\n  \"$env:ProgramFiles\\Microsoft\\Edge\\Application\\msedge.exe\",\r\n  \"$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe\",\r\n  \"${env:ProgramFiles(x86)}\\Google\\Chrome\\Application\\chrome.exe\",\r\n  \"$env:LOCALAPPDATA\\Google\\Chrome\\Application\\chrome.exe\"\r\n)\r\n$browser = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1\r\n\r\n$shell = New-Object -ComObject WScript.Shell\r\n$dirs = @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))\r\nforeach ($d in $dirs) {\r\n  if ($browser) {\r\n    $lnk = $shell.CreateShortcut((Join-Path $d \"$name.lnk\"))\r\n    $lnk.TargetPath = $browser\r\n    $lnk.Arguments = \"--app=$url\"\r\n    $lnk.IconLocation = $ico\r\n    $lnk.WorkingDirectory = $dst\r\n    $lnk.Description = 'Чат по комнатам'\r\n    $lnk.Save()\r\n  } else {\r\n    $lnk = $shell.CreateShortcut((Join-Path $d \"$name.url\"))\r\n    $lnk.TargetPath = $url\r\n    $lnk.Save()\r\n    Set-Content -Path (Join-Path $d \"$name.url\") -Value (\"[InternetShortcut]`r`nURL=$url`r`nIconFile=$ico`r`nIconIndex=0\") -Encoding ASCII\r\n  }\r\n}\r\n\r\nWrite-Host ''\r\nWrite-Host \"Готово! Ярлык «$name» добавлен на рабочий стол и в меню «Пуск».\" -ForegroundColor Green\r\nif ($browser) { Start-Process $browser -ArgumentList \"--app=$url\" } else { Start-Process $url }\r\nStart-Sleep -Seconds 3\r\n",MAC_TPL="#!/bin/bash\n# Установка приложения «Чат» на Mac: создаёт Чат.app и кладёт его на рабочий стол и в «Программы».\nURL=\"%%URL%%\"\nNAME=\"Чат\"\nICON_B64=\"%%ICNS%%\"\n\nAPPS=\"$HOME/Applications\"\nDESK=\"$HOME/Desktop\"\nmkdir -p \"$APPS\"\n\nAPP=\"$APPS/$NAME.app\"\nrm -rf \"$APP\"\nmkdir -p \"$APP/Contents/MacOS\" \"$APP/Contents/Resources\"\n\ncat > \"$APP/Contents/Info.plist\" <<'PLIST'\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n  <key>CFBundleName</key><string>Чат</string>\n  <key>CFBundleDisplayName</key><string>Чат</string>\n  <key>CFBundleIdentifier</key><string>local.chat.rooms</string>\n  <key>CFBundleExecutable</key><string>launcher</string>\n  <key>CFBundleIconFile</key><string>icon</string>\n  <key>CFBundlePackageType</key><string>APPL</string>\n  <key>CFBundleVersion</key><string>1.0</string>\n  <key>CFBundleShortVersionString</key><string>1.0</string>\n  <key>LSUIElement</key><true/>\n</dict>\n</plist>\nPLIST\n\ncat > \"$APP/Contents/MacOS/launcher\" <<LAUNCH\n#!/bin/bash\nURL=\"$URL\"\nfor B in \"Google Chrome\" \"Microsoft Edge\" \"Brave Browser\" \"Chromium\"; do\n  for D in /Applications \"\\$HOME/Applications\"; do\n    if [ -d \"\\$D/\\$B.app\" ]; then\n      open -na \"\\$D/\\$B.app\" --args --app=\"\\$URL\"\n      exit 0\n    fi\n  done\ndone\nopen \"\\$URL\"\nLAUNCH\nchmod +x \"$APP/Contents/MacOS/launcher\"\n\nprintf '%s' \"$ICON_B64\" | base64 -D > \"$APP/Contents/Resources/icon.icns\" 2>/dev/null \\\n  || printf '%s' \"$ICON_B64\" | base64 -d > \"$APP/Contents/Resources/icon.icns\"\n\n# ярлык на рабочем столе\nrm -rf \"$DESK/$NAME.app\"\ncp -R \"$APP\" \"$DESK/$NAME.app\"\ntouch \"$APP\" \"$DESK/$NAME.app\"\n\necho \"\"\necho \"Готово! Приложение «$NAME» добавлено на рабочий стол и в папку «Программы».\"\nopen \"$DESK/$NAME.app\"\nsleep 2\n",ICO_B64="AAABAAQAEBAAAAAAIAARAwAARgAAACAgAAAAACAA
